syntax = "proto3";

package keyserver.v1;

option go_package = "github.com/policies2/protobufs/keyserver/v1;keyserverv1";

import "google/protobuf/timestamp.proto";

service KeyService {
  rpc GenerateKey(GenerateKeyRequest) returns (GenerateKeyResponse);
  rpc PutTenantDatabase(PutTenantDatabaseRequest) returns (PutTenantDatabaseResponse);
  rpc ValidateKey(ValidateKeyRequest) returns (ValidateKeyResponse);
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse);
  rpc Healthz(HealthzRequest) returns (HealthzResponse);
}

message GenerateKeyRequest {
  string tenant_id = 1;
  string user_id = 2;
  string org_id = 3;
  repeated string scopes = 4;
  string issued_by_user_id = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool shared_db = 7;
  string name = 8;
  string replaces_key_id = 9;
}

message GenerateKeyResponse {
  string api_key = 1;
  string key_id = 2;
  string tenant_id = 3;
  string user_id = 4;
  string org_id = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated string scopes = 7;
  string owner_type = 8;
  string owner_id = 9;
  string issued_by_user_id = 10;
  google.protobuf.Timestamp expires_at = 11;
  bool shared_db = 12;
  bool valid = 13;
  string name = 14;
  optional string status = 99;
}

message PutTenantDatabaseRequest {
  string tenant_id = 1;
  bool enterprise = 2;
  DatabaseDetails database = 3;
}

message PutTenantDatabaseResponse {
  string tenant_id = 1;
  bool enterprise = 2;
  DatabaseDetails database = 3;
  optional string status = 99;
}

message ValidateKeyRequest {
  string api_key = 1;
}

message ValidateKeyResponse {
  string key_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string org_id = 4;
  DatabaseDetails database = 5;
  repeated string scopes = 6;
  string owner_type = 7;
  string owner_id = 8;
  string issued_by_user_id = 9;
  google.protobuf.Timestamp expires_at = 10;
  bool shared_db = 11;
  bool valid = 12;
  optional string status = 99;
}

message RevokeKeyRequest {
  string key_id = 1;
  string tenant_id = 2;
  string replaced_by_key_id = 3;
}

message RevokeKeyResponse {
  bool revoked = 1;
  optional string status - 99;
}

message ListKeysRequest {
  string tenant_id = 1;
  string owner_type = 2;
  string owner_id = 3;
}

message ListKeysResponse {
  repeated KeyInfo keys = 1;
  optional string status = 99;
}

message GetKeyRequest {
  string key_id = 1;
  string tenant_id = 2;
}

message GetKeyResponse {
  KeyInfo key = 1;
  optional string status = 99;
}

message KeyInfo {
  string key_id = 1;
  string name = 2;
  string owner_type = 3;
  string owner_id = 4;
  string tenant_id = 5;
  string issued_by_user_id = 6;
  repeated string scopes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp revoked_at = 10;
  string replaces_key_id = 11;
  string replaced_by_key_id = 12;
  bool shared_db = 13;
}

message DatabaseDetails {
  string engine = 1;
  string host = 2;
  uint32 port = 3;
  string database = 4;
  string username = 5;
  string password = 6;
  string ssl_mode = 7;
  bool dedicated = 8;
}

message HealthzRequest {}

message HealthzResponse {
  string status = 1;
}
