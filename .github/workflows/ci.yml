name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint Protos
        run: buf lint

      - name: Fetch PR Base Branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Breaking Change Check
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#ref=refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Verify Go Bindings Build
        run: go test ./...
